model:
  radius: 0.05
  enc_dim: 64
  pixel_gnn_layers: 5
  pixel_k: 8
  time_scale: 0.3
  scorer_num_heads: 4
  scorer_num_layers: 2
  scorer_pixel_chunk: 1024
training:
  coarse_loss_weight: 0.3
  epochs: 400
  seed: 42
  learning_rate: 0.0001
  weight_decay: 0.00001
  grad_clip: 1.0
  eval_every: 1
  time_prefix_ratio: 1.0
  activation_checkpointing: true
  scheduler:
    name: plateau
    min_lr: 0.000001
    factor: 0.5
    patience: 20
    cooldown: 5
    threshold: 0.02
    window: 5
  early_stopping:
    patience: 40
